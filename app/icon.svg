<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- "One of ten" mark: ten coins in a ring, the top one lit in the brand
       emerald. Coins use ink that flips to near-white on dark browser themes. -->
  <style>
    .coin { fill: #18181b; }
    .accent { fill: #0b8a5b; }
    @media (prefers-color-scheme: dark) {
      .coin { fill: #fafafa; }
      .accent { fill: #10b981; }
    }
  </style>
  <circle class="accent" cx="20" cy="6" r="2.5" />
  <circle class="coin" cx="28.23" cy="8.67" r="2.5" />
  <circle class="coin" cx="33.31" cy="15.67" r="2.5" />
  <circle class="coin" cx="33.31" cy="24.33" r="2.5" />
  <circle class="coin" cx="28.23" cy="31.33" r="2.5" />
  <circle class="coin" cx="20" cy="34" r="2.5" />
  <circle class="coin" cx="11.77" cy="31.33" r="2.5" />
  <circle class="coin" cx="6.69" cy="24.33" r="2.5" />
  <circle class="coin" cx="6.69" cy="15.67" r="2.5" />
  <circle class="coin" cx="11.77" cy="8.67" r="2.5" />
</svg>
